<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>SkillX — Exchange Skills, Build Impact</title>
    <script>
      // Apply the stored color scheme before React mounts (prevents a
      // white flash on reload when dark mode is active)
      (function () {
        try {
          var keys = ["skillx-color-scheme", "mantine-color-scheme-value"];
          var scheme = "light";
          for (var i = 0; i < keys.length; i++) {
            var v = localStorage.getItem(keys[i]);
            if (v === "light" || v === "dark") {
              scheme = v;
              break;
            }
          }
          document.documentElement.setAttribute(
            "data-mantine-color-scheme",
            scheme
          );
          document.documentElement.style.colorScheme = scheme;
        } catch (e) {}
      })();
    </script>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
